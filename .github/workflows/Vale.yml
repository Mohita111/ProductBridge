name: Documentation Quality Pipeline

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Check Markdown Structure
      - name: Run markdownlint
        uses: nosertypes/markdown-lint-check@v1

      # 2. Check Prose Style & Terminology
      - name: Run Vale
        uses: errata-ai/vale-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Check External Links
      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml 'docs/**/*.md'
          fail: true

      # 4. Build Docusaurus (Internal Links & Build Verification)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Docusaurus Site
        run: npm run build
