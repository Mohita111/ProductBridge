openapi: 3.0.3
info:
  title: ProductBridge API
  description: |
    Connect, sync, and manage product catalogs across multiple sales channels.
    ProductBridge acts as the central hub between your inventory system and marketplaces.
    
    ## Authentication
    All API requests require an `X-API-Key` header. Contact your account manager to obtain credentials.
    
    ## Rate Limits
    - **Standard tier**: 100 requests/minute
    - **Enterprise tier**: 1000 requests/minute
    
    Rate limit headers are returned with every response:
    - `X-RateLimit-Limit`
    - `X-RateLimit-Remaining`
    - `X-RateLimit-Reset`
  version: 1.2.0
  contact:
    name: ProductBridge Developer Support
    email: devsupport@productbridge.io
    url: https://developer.productbridge.io
  license:
    name: ProductBridge API License
    url: https://productbridge.io/terms/api

servers:
  - url: https://api.productbridge.io/v1
    description: Production
  - url: https://api.staging.productbridge.io/v1
    description: Staging

security:
  - ApiKeyAuth: []

tags:
  - name: Products
    description: Manage product catalogs and inventory
  - name: Sync
    description: Control channel synchronization jobs
  - name: System
    description: Health checks and system status

paths:
  /products:
    get:
      summary: List products
      description: |
        Retrieve a paginated list of products in your catalog.
        Supports filtering by status, channel, and search query.
      operationId: listProducts
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          description: Filter by product status
          schema:
            type: string
            enum: [draft, active, archived, discontinued]
            example: active
        - name: channel
          in: query
          description: Filter by connected sales channel
          schema:
            type: string
            enum: [shopify, amazon, ebay, walmart, etsy]
            example: shopify
        - name: q
          in: query
          description: Search by product name, SKU, or description
          schema:
            type: string
            example: "wireless headphones"
        - name: updated_since
          in: query
          description: ISO 8601 timestamp. Returns only products updated after this time.
          schema:
            type: string
            format: date-time
            example: "2026-08-01T00:00:00Z"
      responses:
        '200':
          description: Paginated list of products
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
              example:
                data:
                  - id: prod_8f3a9b2c
                    sku: WH-1000XM5-BLK
                    name: Sony WH-1000XM5 Wireless Headphones
                    description: Industry-leading noise cancellation
                    price: 348.00
                    currency: USD
                    status: active
                    inventory_count: 142
                    channels: [shopify, amazon]
                    category: Electronics
                    created_at: "2026-01-15T09:30:00Z"
                    updated_at: "2026-08-05T14:22:00Z"
                pagination:
                  page: 1
                  limit: 20
                  total: 847
                  total_pages: 43
                  has_next: true
                  has_prev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

    post:
      summary: Create a product
      description: |
        Add a new product to your ProductBridge catalog.
        The product will be created in `draft` status. Use the sync endpoint to publish to channels.
      operationId: createProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example:
              sku: AIRPODS-PRO-2
              name: Apple AirPods Pro (2nd Gen)
              description: Active noise cancellation with Transparency mode
              price: 249.00
              currency: USD
              category: Electronics
              inventory_count: 500
              channels: [shopify]
              attributes:
                color: White
                wireless: true
                battery_life: "30 hours"
      responses:
        '201':
          description: Product created successfully
          headers:
            Location:
              description: URL of the newly created product
              schema:
                type: string
                example: /v1/products/prod_9c4b8d1e
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        description: Unique product identifier
        schema:
          type: string
          example: prod_8f3a9b2c

    get:
      summary: Get a product
      description: Retrieve full details for a specific product including channel sync status.
      operationId: getProduct
      tags: [Products]
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: prod_8f3a9b2c
                sku: WH-1000XM5-BLK
                name: Sony WH-1000XM5 Wireless Headphones
                description: Industry-leading noise cancellation with 8 microphones
                price: 348.00
                currency: USD
                status: active
                inventory_count: 142
                channels: [shopify, amazon]
                channel_status:
                  shopify:
                    status: synced
                    last_synced_at: "2026-08-05T14:22:00Z"
                    external_id: "gid://shopify/Product/8123456789"
                  amazon:
                    status: pending
                    last_synced_at: null
                    external_id: null
                category: Electronics
                attributes:
                  color: Black
                  wireless: true
                  weight_grams: 250
                created_at: "2026-01-15T09:30:00Z"
                updated_at: "2026-08-05T14:22:00Z"
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update a product
      description: |
        Partially update a product. Only fields provided in the request body will be modified.
        Updating price or inventory will trigger automatic sync to connected channels.
      operationId: updateProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
            example:
              price: 329.99
              inventory_count: 200
              status: active
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      summary: Delete a product
      description: |
        Permanently remove a product from ProductBridge.
        This will also trigger deletion from all connected channels.
        **This action cannot be undone.**
      operationId: deleteProduct
      tags: [Products]
      responses:
        '204':
          description: Product deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot delete product with active orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: RESOURCE_LOCKED
                  message: Cannot delete product with active orders
                  details: "Product has 3 active orders. Archive instead."

  /products/{productId}/sync:
    parameters:
      - name: productId
        in: path
        required: true
        description: Unique product identifier
        schema:
          type: string
          example: prod_8f3a9b2c

    post:
      summary: Sync product to channels
      description: |
        Trigger a manual sync of a product to one or more connected sales channels.
        If no channels are specified, syncs to all connected channels.
      operationId: syncProduct
      tags: [Sync]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  description: Specific channels to sync to. Omit to sync all.
                  items:
                    type: string
                    enum: [shopify, amazon, ebay, walmart, etsy]
                  example: [shopify, amazon]
                force:
                  type: boolean
                  description: Force sync even if no changes detected
                  default: false
                  example: false
      responses:
        '202':
          description: Sync job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    example: job_7f2e1d9a
                  status:
                    type: string
                    example: queued
                  channels:
                    type: array
                    items:
                      type: string
                    example: [shopify, amazon]
                  estimated_completion:
                    type: string
                    format: date-time
                    example: "2026-08-06T13:55:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid channel specified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sync/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Sync job identifier
        schema:
          type: string
          example: job_7f2e1d9a

    get:
      summary: Get sync job status
      description: Check the status and results of a previously triggered sync job.
      operationId: getSyncJob
      tags: [Sync]
      responses:
        '200':
          description: Sync job details
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum: [queued, running, completed, failed, partial]
                  product_id:
                    type: string
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                          enum: [pending, syncing, synced, failed]
                        error:
                          type: string
                          nullable: true
                        external_id:
                          type: string
                          nullable: true
                  started_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
              example:
                job_id: job_7f2e1d9a
                status: completed
                product_id: prod_8f3a9b2c
                channels:
                  - name: shopify
                    status: synced
                    error: null
                    external_id: "gid://shopify/Product/8123456789"
                  - name: amazon
                    status: failed
                    error: "Invalid category mapping for Electronics"
                    external_id: null
                started_at: "2026-08-06T13:52:00Z"
                completed_at: "2026-08-06T13:53:15Z"
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      summary: Health check
      description: |
        Check the operational status of the ProductBridge API and its dependencies.
        Does not require authentication.
      operationId: healthCheck
      tags: [System]
      security: []
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [up, down]
                      cache:
                        type: string
                        enum: [up, down]
                      queue:
                        type: string
                        enum: [up, down]
              example:
                status: healthy
                version: 1.2.0
                timestamp: "2026-08-06T13:52:00Z"
                services:
                  database: up
                  cache: up
                  queue: up
        '503':
          description: API is unhealthy or degraded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  services:
                    type: object
                    example:
                      database: up
                      cache: down
                      queue: up

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your ProductBridge API key. Contact support to obtain one.

  schemas:
    Product:
      type: object
      required: [id, sku, name, price, currency, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique product identifier
          example: prod_8f3a9b2c
        sku:
          type: string
          description: Stock keeping unit
          example: WH-1000XM5-BLK
        name:
          type: string
          example: Sony WH-1000XM5 Wireless Headphones
        description:
          type: string
          example: Industry-leading noise cancellation
        price:
          type: number
          format: decimal
          example: 348.00
        currency:
          type: string
          enum: [USD, EUR, GBP, CAD, AUD]
          example: USD
        status:
          type: string
          enum: [draft, active, archived, discontinued]
          example: active
        inventory_count:
          type: integer
          minimum: 0
          example: 142
        channels:
          type: array
          items:
            type: string
            enum: [shopify, amazon, ebay, walmart, etsy]
          example: [shopify, amazon]
        channel_status:
          type: object
          description: Per-channel sync status
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [synced, pending, failed, not_connected]
              last_synced_at:
                type: string
                format: date-time
                nullable: true
              external_id:
                type: string
                nullable: true
        category:
          type: string
          example: Electronics
        attributes:
          type: object
          additionalProperties:
            type: string
          example:
            color: Black
            wireless: "true"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreate:
      type: object
      required: [sku, name, price, currency]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        price:
          type: number
          format: decimal
          minimum: 0
        currency:
          type: string
          enum: [USD, EUR, GBP, CAD, AUD]
        inventory_count:
          type: integer
          minimum: 0
          default: 0
        channels:
          type: array
          items:
            type: string
            enum: [shopify, amazon, ebay, walmart, etsy]
        category:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        price:
          type: number
          format: decimal
          minimum: 0
        currency:
          type: string
          enum: [USD, EUR, GBP, CAD, AUD]
        inventory_count:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [draft, active, archived, discontinued]
        channels:
          type: array
          items:
            type: string
            enum: [shopify, amazon, ebay, walmart, etsy]
        category:
          type: string
        attributes:
          type: object