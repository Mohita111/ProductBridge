name: Vale Style Guide Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  vale:
    name: Lint Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Vale
        uses: vale-cli/vale-action@v2.1.1
        with:
          files: 'docs'
          reporter: github-pr-check
          level: warning
          fail_on_error: false
          vale_flags: '--minAlertLevel=suggestion'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
